# Hand-written (not auto-generated) — see Build.CI.GitHubActions.cs for the
# rationale (lets us bridge GitHub's NUGET_API_KEY secret to Fallout's
# NuGetApiKey parameter, which would otherwise have to share a name).
#
# This is the DELIBERATE (production) release path. The fast test lane —
# develop (-alpha) and release/* (-beta), push → GitHub Packages — lives in
# publish-packages-preview.yml. See ADR-0011 (GitVersion and tag-driven releases).
#
# Shape:
#   - Trigger: tag push `X.Y.Z[-label]` (no `v` prefix) on a production branch —
#     the classic GitFlow production trunk (main → tag 10.5.0), release
#     stabilization lines (release/v10.5 or release/10.5 → tag 10.5.0-rc.N), or
#     gitflow support lines (support/v10). develop is NEVER tagged for release.
#     Tag protection restricts who can create those tags to repo admins.
#   - The tag IS the package version. It is passed to the build as ReleaseTag
#     (see Build.cs); the branch does not matter for the version.
#   - Optional fallback: workflow_dispatch with an existing-tag input, for
#     re-runs after a transient publish-API failure.
#   - validate-ref → test-and-pack → fan out to three publish jobs in parallel:
#       - publish-nuget-org       (GA and -rc tags only)
#       - publish-github-packages (all packages — Fallout.* + Nuke.*)
#       - publish-github-releases (artifact bundling on the tag's GH Release)
#
# Channel routing (ADR-0011):
#   - nuget.org gets Fallout.* from a GA tag (10.5.0) or an -rc tag
#     (10.5.0-rc.2). Any other prerelease tag (10.5.0-beta.1, ...) skips it.
#     There is no approval step.
#   - GitHub Packages gets every Fallout.* and Nuke.* build via tag push.
#   - GitHub Releases bundles nupkgs on the tag's release page regardless.
#
# See docs/branching-and-release.md for the full runbook.

# The workflow `name:` below is load-bearing: Build.cs gates
# ICreateGitHubRelease.CreateGitHubRelease on `github.workflow ==
# ReleaseWorkflow` (the const in build/Build.CI.GitHubActions.cs). Keep the two
# in sync — rename here and you must rename the const, or GitHub Releases stop
# being cut.
name: publish-packages-release

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'
  # Manual fallback: re-run a partial publish after a transient API failure
  # (pick the tag). `--skip-duplicate` on each push makes re-runs idempotent.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re-)release (e.g. 10.5.5)'
        required: true

permissions:
  contents: read

jobs:
  validate-ref:
    name: validate ref
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: 'Verify tag is reachable from a production branch'
        run: |
          set -euo pipefail
          TAG_SHA="${{ github.sha }}"
          # Match the GitFlow production trunk (main, GA tags), release
          # stabilization lines (release/v10.5, …, rc tags), and gitflow
          # support lines (support/v10 legacy semver, and eventually a retired
          # support/v11, …).
          REACHABLE=$(git branch -r --contains "$TAG_SHA" | grep -E 'origin/(main|release/v?[0-9]+(\.[0-9]+)?|support/v[0-9]+)$' || true)
          if [ -z "$REACHABLE" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} at $TAG_SHA is not reachable from any production branch."
            echo "Tag-triggered releases only fire from main (GA), release/vX.Y (rc), or support/* (legacy/retired) branches."
            exit 1
          fi
          echo "Tag ${GITHUB_REF_NAME} validated. Reachable from:"
          echo "$REACHABLE"

  test-and-pack:
    name: test + pack
    runs-on: ubuntu-latest
    needs: [validate-ref]
    # Run when validate-ref succeeded (tag push) OR was skipped (workflow_dispatch).
    if: always() && (needs.validate-ref.result == 'success' || needs.validate-ref.result == 'skipped')
    outputs:
      push-to-nugetorg: ${{ steps.route.outputs.push }}
    steps:
      - name: 'Route: does this tag go to nuget.org?'
        id: route
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          if [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG goes to nuget.org."
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG is neither GA nor -rc. Skipping nuget.org."
          fi
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0           # GitVersion needs full history
      - name: 'Cache: .fallout/temp, ~/.nuget/packages'
        uses: actions/cache@v6
        with:
          path: |
            .fallout/temp
            ~/.nuget/packages
          key: ${{ runner.os }}-release-${{ hashFiles('**/global.json', '**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-release-
      - name: 'Setup: .NET SDK'
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: 'Restore: dotnet tools'
        run: dotnet tool restore
      - name: 'Run: Test + Pack + PackageGuard'
        run: dotnet fallout Test Pack PackageGuard
        env:
          # The tag is the package version. The tag checkout above leaves HEAD
          # detached, where GitVersion ignores a tag whose label differs from the
          # branch label, so Build.cs takes the version straight from ReleaseTag.
          ReleaseTag: ${{ inputs.tag || github.ref_name }}
          # PackageGuard's own target (build/Build.PackageGuard.cs) is gated on either being on
          # a long-lived branch or running in this workflow (GitHubActions.Workflow ==
          # "publish-packages-release") — the tag checkout above leaves HEAD detached, so the
          # branch check alone can't pass here; validate-ref already proved the tag is
          # reachable from a production branch. GITHUB_TOKEN lets it authenticate to GitHub
          # (license lookups) instead of hitting anonymous rate limits.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: 'Upload: package artifacts'
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: output/packages/*.nupkg
          retention-days: 7
          if-no-files-found: error
      - name: 'Upload: PackageGuard SBOM + risk report'
        uses: actions/upload-artifact@v7
        with:
          name: packageguard
          path: output/packageguard/*
          retention-days: 7
          if-no-files-found: error

  # Tier 1 — production / nuget.org. A GA tag (10.5.0) or an -rc tag (10.5.0-rc.2)
  # publishes Fallout.* here automatically. Any other prerelease tag
  # (10.5.0-beta.1, ...) skips the push. There is no approval step: nuget.org
  # pushes cannot be undone, so tag protection (admins only) is the gate.
  publish-nuget-org:
    name: publish → nuget.org
    runs-on: ubuntu-latest
    needs: [test-and-pack]
    # `always() && needs...result == 'success'` rather than a bare dependency:
    # validate-ref is skipped by design on workflow_dispatch, and a skipped job
    # propagates through the graph — test-and-pack's own always() rescues only
    # itself, not its dependents. Without this the whole dispatch path silently
    # published nothing while the run still reported success.
    # Routed at job level, so a skipped tag never creates a nuget-org deployment.
    if: >-
      always() && needs.test-and-pack.result == 'success'
      && needs.test-and-pack.outputs.push-to-nugetorg == 'true'
    environment:
      name: nuget-org
      url: https://www.nuget.org/profiles/Fallout.build
    steps:
      - name: 'Setup: .NET SDK'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'
      - name: 'Download: package artifacts'
        uses: actions/download-artifact@v8
        with:
          name: packages
          path: output/packages
      - name: 'Push: Fallout.* to nuget.org'
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(output/packages/Fallout.*.nupkg)
          if [ ${#packages[@]} -eq 0 ]; then
            echo "::error::No Fallout.* packages found in artifact — nothing to publish."
            exit 1
          fi
          for pkg in "${packages[@]}"; do
            echo "Pushing $pkg to nuget.org..."
            dotnet nuget push "$pkg" \
              --source "https://api.nuget.org/v3/index.json" \
              --api-key "${{ secrets.NUGET_API_KEY }}" \
              --skip-duplicate
          done

  # Tier 2 — GitHub Packages. The default release channel. Pushes both
  # Fallout.* AND Nuke.* transition shims. The Nuke.* shim IDs are owned by the
  # original NUKE maintainer on nuget.org (#47) — GitHub Packages is their
  # permanent home. Fallout.* is here for every tag, including the ones that
  # skip nuget.org (see header).
  publish-github-packages:
    name: publish → GitHub Packages
    runs-on: ubuntu-latest
    needs: [test-and-pack]
    # See publish-nuget-org: survives validate-ref's by-design skip on
    # workflow_dispatch, which is what makes a re-run after a partial publish
    # actually re-publish.
    if: always() && needs.test-and-pack.result == 'success'
    permissions:
      packages: write
    environment:
      name: github-packages
      url: https://github.com/Fallout-build/Fallout/packages
    steps:
      - name: 'Setup: .NET SDK'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'
      - name: 'Download: package artifacts'
        uses: actions/download-artifact@v8
        with:
          name: packages
          path: output/packages
      - name: 'Push: all *.nupkg to GitHub Packages'
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(output/packages/*.nupkg)
          if [ ${#packages[@]} -eq 0 ]; then
            echo "::error::No packages found in artifact — nothing to publish."
            exit 1
          fi
          for pkg in "${packages[@]}"; do
            echo "Pushing $pkg to GitHub Packages..."
            dotnet nuget push "$pkg" \
              --source "https://nuget.pkg.github.com/Fallout-build/index.json" \
              --api-key "${{ secrets.GITHUB_TOKEN }}" \
              --skip-duplicate
          done

  # Bundled artifact distribution. Attaches all nupkgs, plus the PackageGuard SBOM and HTML
  # risk report, to the GitHub Release for the tag. Idempotent: if the release already exists
  # (workflow_dispatch retry case), uploads or replaces missing assets via --clobber. The .sarif
  # itself isn't attached here — it's reported to GitHub's code-scanning feature instead
  # (security-scan.yml); the HTML is the human-readable counterpart of the same report.
  publish-github-releases:
    name: publish → GitHub Releases
    runs-on: ubuntu-latest
    needs: [test-and-pack]
    # See publish-nuget-org.
    if: always() && needs.test-and-pack.result == 'success'
    permissions:
      contents: write
    environment:
      name: github-releases
      url: https://github.com/Fallout-build/Fallout/releases
    steps:
      - uses: actions/checkout@v7
      - name: 'Download: package artifacts'
        uses: actions/download-artifact@v8
        with:
          name: packages
          path: output/packages
      - name: 'Download: PackageGuard SBOM + risk report'
        uses: actions/download-artifact@v8
        with:
          name: packageguard
          path: output/packageguard
      - name: 'Create or update GitHub Release with package artifacts'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "Tag: $TAG"
          assets=(output/packages/*.nupkg)
          if [ -f output/packageguard/sbom.json ]; then
            assets+=("output/packageguard/sbom.json")
          fi
          if [ -f output/packageguard/risk-report.html ]; then
            assets+=("output/packageguard/risk-report.html")
          fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists — uploading assets with --clobber."
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            echo "Creating new release $TAG."
            gh release create "$TAG" \
              --title "$TAG" \
              --target "$(git rev-parse HEAD)" \
              --generate-notes \
              "${assets[@]}"
          fi
